<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <header>
        <div>
            <h1>Expense Tracker</h1>
            <p>Track and manage your expenses</p>
        </div>
        <nav>
                <a href="#dashboard">Dashboard</a>
                <a href="#expenses">Expenses</a>
        </nav>
    </header>
    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <div class="filter-container">
                <button id="filter-toggle">
                    Filter Options
                    <span id="filter-arrow">▼</span>
                </button>

                <div id="filter-options" class="hidden">
                    <label for="category-filter">Category</label>
                    <select id="category-filter">
                        <option value="All">All categories</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Investment">Investment</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Others">Others</option>
                    </select>

                    <div class="date-range">

                        <div>
                            <label for="date-from">From</label>
                            <input type="date" id="date-from">
                        </div>

                        <div>
                            <label for="date-to">To</label>
                            <input type="date" id="date-to">
                        </div>

                    </div>
                    <div class="amount-range">

                        <div>
                            <label for="amount-min">Min Amount (₹)</label>
                            <input
                                type="number"
                                id="amount-min"
                                placeholder="No minimum"
                                min="0"
                                step="0.01"
                            >
                        </div>

                        <div>
                            <label for="amount-max">Max Amount (₹)</label>
                            <input
                                type="number"
                                id="amount-max"
                                placeholder="No maximum"
                                min="0"
                                step="0.01"
                            >
                        </div>

                    </div>

                    <div class="filter-actions">
                        <button id="apply-filters">Apply Filters</button>
                        <button id="clear-filters">Clear Filters</button>
                    </div>

    
                </div>

            </div>
            <div class="summary-cards">

                <div class="summary-card">
                    <h3>Total Expenses</h3>
                    <p id="total-expenses">₹0.00</p>
                </div>

                <div class="summary-card">
                    <h3>Total Transactions</h3>
                    <p id="total-transactions">0</p>
                </div>

    
            </div>
        <div class="analytics-section">
            <div class="category-chart">
                <h3>Spending by Category</h3>
                <div class="category-chart-canvas">
                    <canvas id="category-chart"></canvas>
                </div>   
            </div>
            <div class="monthly-chart">
                <h3>Spending Over Time</h3>

                <div id="monthly-chart">
                    <canvas id="monthly-expense-chart"></canvas>
                </div>
            </div>
            <div class="recent-expenses">
                <h3>Recent Transactions</h3>

                <div id="recent-expenses-list">
                    <!-- Recent expenses will appear here -->
                </div>
                <button id="show-more">Show More</button>

                <div id="pagination" class="hidden">
                    <button id="previous-page">← Previous</button>
                    <span id="page-number">Page 1</span>
                    <button id="next-page">Next →</button>
                </div>
            </div>
        </div>
        </section>

        <section id="expenses">

            <h2>Expenses</h2>

            <div class="expense-tabs">

                <div class="tab-indicator"></div>

                <button class="tab-button active" data-tab="add">
                    Add
                </button>

                <button class="tab-button" data-tab="edit">
                    Edit
                </button>

                <button class="tab-button" data-tab="delete">
                    Delete
                </button>

                <button class="tab-button" data-tab="search">
                    Search
                </button>

            </div>

            <div class="expense-panel">

                <div id="add-panel" class="tab-content active">
                    <h3>Add Expense</h3>

                    <label for="add-description">Description</label>
                    <input type="text" id="add-description" placeholder="Enter description">

                    <label for="add-amount">Amount (₹)</label>
                    <input type="number" id="add-amount" placeholder="Enter amount">

                    <label for="add-category">Category</label>
                    <select id="add-category">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Investment">Investment</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Others">Others</option>
                    </select>

                    <label for="add-date">Date</label>
                    <input type="date" id="add-date">

                    <button id="add-expense-btn">Add Expense</button>
                </div>

                <div id="edit-panel" class="tab-content">
                    <h3>Edit Expense</h3>

                    <label for="edit-id">Expense ID</label>
                    <input type="number" id="edit-id" placeholder="Enter expense ID">

                    <label for="edit-description">New Description</label>
                    <input type="text" id="edit-description" placeholder="Enter new description">

                    <label for="edit-amount">New Amount (₹)</label>
                    <input type="number" id="edit-amount" placeholder="Enter new amount">

                    <label for="edit-category">New Category</label>
                    <select id="edit-category">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Investment">Investment</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Others">Others</option>
                    </select>

                    <label for="edit-date">New Date</label>
                    <input type="date" id="edit-date">

                    <button id="edit-expense-btn">Update Expense</button>
                </div>

                <div id="delete-panel" class="tab-content">
                    <h3>Delete Expense</h3>

                    <label for="delete-id">Expense ID</label>
                    <input type="number" id="delete-id" placeholder="Enter expense ID">

                    <button id="delete-expense-btn">Delete Expense</button>
                </div>

                <div id="search-panel" class="tab-content">
                    <h3>Search Expenses</h3>

                    <label for="search-description">Description</label>
                    <input type="text" id="search-description" placeholder="Search by description">

                    <label for="search-category">Category</label>
                    <select id="search-category">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Investment">Investment</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Others">Others</option>
                    </select>

                    <button id="search-expense-btn">Search</button>
                </div>

            </div>

        </section>
    </main>
</body>

</html>
